[package]
name = "sentinel"
version = "0.1.0"
description = "The Solana Sentinel - On-Chain Alert Registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anchor-lang = "0.31"
anchor-spl = "0.31"
spl-token = { version = "~4", features = ["no-entrypoint"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
